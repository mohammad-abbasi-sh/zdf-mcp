[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zdf-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for ZDF heute news"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
zdf-mcp = "zdf_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zdf_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://www.zdfheute.de site"]
